# Despliegue en servidor. Use ./install.sh (genera .env.prod y levanta todo).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agenda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agenda:${POSTGRES_PASSWORD}@db:5432/agenda
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ_APP: ${TZ_APP:-America/Guayaquil}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WA_AUTH_DIR: /data/wa-auth
    volumes:
      - waauth:/data/wa-auth
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  waauth:
